name: Enforce Test Inclusion in PR

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited]

permissions:
  checks: write
  contents: read

jobs:
  enforce-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check for SKIP label
        id: check_label
        run: |
          labels=$(jq -r '.pull_request.labels[].name' <<< "${{ toJson(github.event.pull_request) }}")
          echo "Labels: $labels"
          if echo "$labels" | grep -q "^SKIP$"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Update check status
        uses: LouisBrunner/checks-action@6b626ffbad7cc56fd58627f774b9067e6118af23
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Verify tests check status - Tests Inclusion Mandatory Checker
          sha: ${{ github.event.pull_request.head.sha }}
          status: completed
          conclusion: ${{ steps.check_label.outputs.skip == 'true' && 'success' || 'failure' }}
          output: |
            {
              "summary": "${{ steps.check_label.outputs.skip == 'true' && 'SKIP label present, check passed.' || 'SKIP label missing, check failed.' }}"
            }
