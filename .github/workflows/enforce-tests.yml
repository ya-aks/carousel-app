name: Enforce Test Inclusion in PR
on:
  pull_request:
    types: [opened, synchronize, reopened, reviewed]
  pull_request_review:
    types: [submitted, edited]

jobs:
  enforce-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Fail if no tests included
        run: |
          echo "Error: No test files included in this pull request."
          exit 0
