name: Enforce Test Inclusion in PR
on:
  pull_request:
    types: [opened, synchronize, reopened, reviewed]
  pull_request_review:
    types: [submitted, edited]
permissions:
  checks: write
  contents: read
  
jobs:
  enforce-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: LouisBrunner/checks-action@6b626ffbad7cc56fd58627f774b9067e6118af23
        if: ${{ always() }}
        with:
            token: ${{ secrets.GITHUB_TOKEN }}
            name: Verify tests check status - Tests Inclusion Mandatory Checker
            status: "completed"
            conclusion: 'failure'
            output: |
              {
                "title": "Verify tests check status - Tests Inclusion Mandatory Checker",
                "summary": "This is a test status check emitted by the workflow.",
                "text": "You can mandate this check in branch protection rules."
              }
